[project]
name = "gke-sandbox-router"
version = "1.0.0"
description = "FastAPI Router & Session Gateway for GKE Agent Sandbox Warmpools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "kubernetes>=30.1.0",
    "pydantic>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
