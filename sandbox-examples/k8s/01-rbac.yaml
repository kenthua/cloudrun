apiVersion: v1
kind: ServiceAccount
metadata:
  name: gke-sandbox-router-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gke-sandbox-router-role
rules:
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims", "sandboxwarmpools", "sandboxtemplates"]
  verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["podsnapshot.gke.io"]
  resources: ["podsnapshotmanualtriggers", "podsnapshotpolicies", "podsnapshotstorageconfigs", "podsnapshots"]
  verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gke-sandbox-router-binding
subjects:
- kind: ServiceAccount
  name: gke-sandbox-router-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: gke-sandbox-router-role
  apiGroup: rbac.authorization.k8s.io
