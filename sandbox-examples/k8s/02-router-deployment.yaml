apiVersion: apps/v1
kind: Deployment
metadata:
  name: gke-sandbox-router
  namespace: default
  labels:
    app: gke-sandbox-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gke-sandbox-router
  template:
    metadata:
      labels:
        app: gke-sandbox-router
    spec:
      serviceAccountName: gke-sandbox-router-sa
      containers:
      - name: router
        image: us-central1-docker.pkg.dev/kenthua-alto-agents/cloud-run-source-deploy/gke-sandbox-router:latest
        imagePullPolicy: Always
        env:
        - name: SANDBOX_NAMESPACE
          value: "default"
        - name: WARMPOOL_NAME
          value: "python-runtime-warmpool"
        - name: SANDBOX_TEMPLATE_NAME
          value: "python-runtime-template"
        - name: SANDBOX_PORT
          value: "8888"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
