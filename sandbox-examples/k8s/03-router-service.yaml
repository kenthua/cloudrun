apiVersion: v1
kind: Service
metadata:
  name: gke-sandbox-router-svc
  namespace: default
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
  labels:
    app: gke-sandbox-router
spec:
  type: LoadBalancer
  selector:
    app: gke-sandbox-router
  ports:
  - name: http
    port: 8080
    targetPort: 8080
