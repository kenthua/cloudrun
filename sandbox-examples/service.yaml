apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sandbox-sidecar
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        version: "v16-suspend-resume"
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: 'true'
        run.googleapis.com/container-dependencies: '{"python-orchestrator":["computesdk-sidecar"]}'
        run.googleapis.com/network-interfaces: '[{"network":"general","subnetwork":"central"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      # 1. Ingress Container: Python FastAPI Orchestrator + Managed Agent
      - name: python-orchestrator
        image: us-central1-docker.pkg.dev/kenthua-alto-agents/cloud-run-source-deploy/python-orchestrator:latest
        ports:
        - containerPort: 8080
          name: http1
        env:
        - name: COMPUTESDK_URL
          value: "http://localhost:8081"
        - name: GKE_ROUTER_URL
          value: "http://10.128.0.78:8080"
        - name: SANDBOX_SECRET
          value: "internal-cloudrun-secret"
        - name: GEMINI_MODEL
          value: "gemini-3.8-flash"
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "true"
        - name: GOOGLE_CLOUD_PROJECT
          value: "kenthua-alto-agents"
        - name: GOOGLE_CLOUD_LOCATION
          value: "global"
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
        startupProbe:
          failureThreshold: 3
          periodSeconds: 10
          tcpSocket:
            port: 8080
          timeoutSeconds: 5

      # 2. Sidecar Container: Official ComputeSDK Native Gateway (local fallback)
      - name: computesdk-sidecar
        image: us-central1-docker.pkg.dev/kenthua-alto-agents/cloud-run-source-deploy/computesdk-sidecar:latest
        env:
        - name: PORT
          value: "8081"
        - name: SANDBOX_SECRET
          value: "internal-cloudrun-secret"
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
        sandboxLauncher: true
        startupProbe:
          failureThreshold: 3
          periodSeconds: 10
          httpGet:
            path: /v1/health
            port: 8081
          timeoutSeconds: 5
